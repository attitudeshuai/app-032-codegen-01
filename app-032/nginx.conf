server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # gzip
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/json application/javascript
                      application/x-javascript text/javascript image/svg+xml application/xml;

    # 健康检查
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # SVG 明确的 MIME 类型（本 location 内独立 types 表）
    location ~* \.svg$ {
        types {
            image/svg+xml svg;
        }
        default_type image/svg+xml;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # 哈希资源长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 入口不缓存
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # SPA 回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
